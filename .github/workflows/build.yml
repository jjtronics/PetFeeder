---
name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Arduino CLI config init
        run: arduino-cli config init

      - name: Add ESP8266 board manager URL
        run: |
          arduino-cli config add board_manager.additional_urls \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json

      - name: Update Arduino core index
        run: arduino-cli core update-index

      - name: Install ESP8266 core
        run: arduino-cli core install esp8266:esp8266

      - name: Install required libraries
        run: arduino-cli lib install WiFiManager ArduinoJson PubSubClient

      - name: Compile sketch
        run: |
          arduino-cli compile --fqbn esp8266:esp8266:generic \
            --output-dir build .

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/*.bin

      - name: Upload release asset
        if: steps.create_release.outputs.upload_url
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/PetFeeder.ino.bin
          asset_name: PetFeeder.ino.bin
          asset_content_type: application/octet-stream
