name: Rapport de bug
description: Signaler un dysfonctionnement
title: "[BUG]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci de remplir ce rapport de bug afin de nous aider à améliorer le projet.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Description claire et concise du problème.
      placeholder: "Décrivez le bug rencontré..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
      description: Comment reproduire le comportement ?
      placeholder: |
        1. Aller à '...'
        2. Cliquer sur '...'
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Quel résultat attendiez-vous ?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran
      description: Ajoutez des captures pour expliquer votre problème.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Détails sur l'environnement (OS, version, matériel...).
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Contexte supplémentaire
      description: Ajoutez tout autre contexte.
    validations:
      required: false
